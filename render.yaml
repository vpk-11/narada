services:
  - type: web
    name: narada
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: FORCE_HTTPS
        value: "true"
      - key: ALLOWED_ORIGIN
        value: "*"
      - key: LOG_LEVEL
        value: WARNING

      # ── Default LLM — full LiteLLM model string (provider/model-name) ───────
      # Server-side fallback used when the frontend does not supply its own
      # model / key. Users can override from the sidebar without touching this.
      - key: LLM_MODEL
        value: "groq/openai/gpt-oss-20b"
      - key: SEARCH_PROVIDER
        value: tavily

      # ── Groq (recommended default - free tier) ─────────────────────────────
      - key: GROQ_API_KEY
        sync: false   # set in Render dashboard under Environment (NOT Secret Files -- that mounts a file, does not set this env var)

      # ── Tavily (recommended default - free tier) ───────────────────────────
      - key: TAVILY_API_KEY
        sync: false   # set in Render dashboard under Environment (NOT Secret Files -- that mounts a file, does not set this env var)

      # ── OpenAI (optional fallback) ─────────────────────────────────────────
      - key: OPENAI_API_KEY
        sync: false   # optional - only set if you want OpenAI as a backend fallback. Set under Environment, not Secret Files.

      # ── Anthropic (optional fallback) ──────────────────────────────────────
      - key: ANTHROPIC_API_KEY
        sync: false   # optional - only set if you want Anthropic as a backend fallback. Set under Environment, not Secret Files.

      # ── Brave Search (optional fallback) ───────────────────────────────────
      - key: BRAVE_API_KEY
        sync: false   # optional - only set if you want Brave as a backend fallback. Set under Environment, not Secret Files.

      # ── Fallback ───────────────────────────────────────────────────────────
      # Set to "true" to let users run with the server's Groq + Tavily keys
      # when they have not configured their own keys in the sidebar.
      # Only exposes that the option exists — keys are never sent to the client.
      - key: FALLBACK_ALLOW
        value: "false"   # change to "true" in dashboard to enable

      # ── Pipeline tuning ────────────────────────────────────────────────────
      - key: SEARCH_RESULTS_PER_QUERY
        value: "8"
      - key: MAX_PAGES_TO_SCRAPE
        value: "6"
      - key: SCRAPE_TIMEOUT_SECONDS
        value: "10"
